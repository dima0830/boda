    .tinta { fill: #3e5b3f; stroke: #3e5b3f; } .aro { stroke: #3e5b3f; }
    @media (prefers-color-scheme: dark) { .tinta { fill: #e2c88f; stroke: #e2c88f; } .aro { stroke: #e2c88f; } }
  </style>
  <g class="aro" fill="none" stroke-width="5.5">
    <circle cx="24" cy="36" r="15"/>
    <circle cx="40" cy="36" r="15"/>
  </g>
  <path class="tinta" d="M40 6l5 6-5 6-5-6z"/>
</svg>
